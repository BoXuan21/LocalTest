apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kafka-dashboard.json: |
    {
      "title": "Kafka",
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Kafka JMX target up",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "up{job=\"kafka\"}", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Kafka message rate by topic",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "sum by (topic) (rate(kafka_server_messagesinpersec_count[1m]))", "legendFormat": "{{topic}}" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Messages received (last 15m)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "sum by (topic) (increase(kafka_server_messagesinpersec_count[15m]))", "legendFormat": "{{topic}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        }
      ]
    }