apiVersion: v1
kind: ConfigMap
metadata:
  name: operator-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  operator-dashboard.json: |
    {
      "title": "Self-Healing Operator",
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Target up (1 = scrape succeeded)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "up{job=~\".*operator.*\"}", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "operator_uptime_seconds (resets on self-restart)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "operator_uptime_seconds", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "operator_seconds_until_self_restart",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "operator_seconds_until_self_restart", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Container restarts",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "kube_pod_container_status_restarts_total{pod=~\"self-healing-operator.*\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }