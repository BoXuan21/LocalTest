# manifests/kafka/kafka-alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kafka-message-flow-alerts
  namespace: kafka
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kafka-message-flow
      rules:
        - alert: KafkaMetricsTargetDown
          expr: up{job="kafka"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Kafka JMX metrics endpoint is down"
            description: "Prometheus hasn't been able to scrape {{ $labels.instance }} for 2 minutes."

        - alert: KafkaNoMessagesReceived
          expr: increase(kafka_server_messagesinpersec_count{topic!=""}[15m]) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "No messages received on topic {{ $labels.topic }}"
            description: "Topic {{ $labels.topic }} hasn't received a single message in the last 15 minutes."