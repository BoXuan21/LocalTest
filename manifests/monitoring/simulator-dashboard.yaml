apiVersion: v1
kind: ConfigMap
metadata:
  name: simulator-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  simulator-dashboard.json: |
    {
      "uid": "test-simulator",
      "title": "Test Simulator",
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "sim-target request rate by response code",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum by (response_code) (rate(istio_requests_total{reporter=\"destination\", destination_service_name=\"sim-target\"}[1m]))",
              "legendFormat": "{{response_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "sim-target latency (Istio, destination side)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", destination_service_name=\"sim-target\"}[1m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", destination_service_name=\"sim-target\"}[1m])))",
              "legendFormat": "p99"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", destination_service_name=\"sim-target\"}[5m])))",
              "legendFormat": "p99 (5m window, used by alerts)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "sim-target 5xx error ratio",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\", destination_service_name=\"sim-target\", response_code=~\"5..\"}[2m])) / sum(rate(istio_requests_total{reporter=\"destination\", destination_service_name=\"sim-target\"}[2m]))",
              "legendFormat": "5xx ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Simulator settings",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "sim_setting{group=\"traffic\"}",
              "legendFormat": "traffic {{name}}"
            },
            {
              "expr": "sim_setting{group=\"kafka\"}",
              "legendFormat": "kafka {{name}}"
            },
            {
              "expr": "sim_setting{group=\"logs\"}",
              "legendFormat": "logs {{name}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Kafka messages in by topic",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum by (topic) (rate(kafka_server_brokertopicmetrics_count{name=\"MessagesInPerSec\", topic!=\"\"}[1m]))",
              "legendFormat": "{{topic}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Simulator Kafka produce (client side)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum by (topic) (rate(sim_kafka_messages_produced_total[1m]))",
              "legendFormat": "acked {{topic}}"
            },
            {
              "expr": "rate(sim_kafka_produce_errors_total[1m])",
              "legendFormat": "errors"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Fault pods: memory vs limit",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"demo-stack\", pod=~\"sim-.*\", container!=\"\", container!=\"POD\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"demo-stack\", pod=~\"sim-.*\", resource=\"memory\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Fault pods: CPU vs limit",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"demo-stack\", pod=~\"sim-.*\", container!=\"\", container!=\"POD\"}[2m])) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"demo-stack\", pod=~\"sim-.*\", resource=\"cpu\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Container restarts in demo-stack (10m)",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"demo-stack\"}[10m])) > 0",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        }
      ]
    }
