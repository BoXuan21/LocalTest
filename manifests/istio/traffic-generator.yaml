apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: demo-stack
  labels:
    app: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
        - name: traffic-generator
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                wget -q -T 2 -O /dev/null http://sample-web.demo-stack.svc.cluster.local/ || true
                sleep 1
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
