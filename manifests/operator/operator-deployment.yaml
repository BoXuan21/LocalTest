apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-operator
  namespace: demo-stack
  labels:
    app: self-healing-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healing-operator
  template:
    metadata:
      labels:
        app: self-healing-operator
    spec:
      serviceAccountName: self-healing-operator
      containers:
        - name: operator
          image: operator-demo:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SELF_DESTRUCT_SECONDS
              value: "1200"
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: operator-metrics
  namespace: demo-stack
  labels:
    app: self-healing-operator
spec:
  selector:
    app: self-healing-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
---
apiVersion: demo.example.com/v1
kind: AppConfig
metadata:
  name: demo-config
  namespace: demo-stack
spec:
  message: "hello from k3d demo stack"
