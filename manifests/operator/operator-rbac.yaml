apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing-operator
  namespace: demo-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: self-healing-operator
rules:
  # kopf framework bookkeeping (CRD discovery, events, leader election leases)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch", "get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # our custom resource
  - apiGroups: ["demo.example.com"]
    resources: ["appconfigs", "appconfigs/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # what the operator actually reconciles into
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: self-healing-operator
subjects:
  - kind: ServiceAccount
    name: self-healing-operator
    namespace: demo-stack
roleRef:
  kind: ClusterRole
  name: self-healing-operator
  apiGroup: rbac.authorization.k8s.io
